<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BJSN Player - Harmonic Inc</title>
  <style>
    :root {
      /* Harmonic Inc Brand Colors */
      --color-scooter: #25B0D9;
      --color-alice-blue: #F4FAFF;
      --color-white: #FFFFFF;
      --color-tangaroa: #03243D;
      
      /* Derived colors */
      --color-scooter-light: rgba(37, 176, 217, 0.1);
      --color-scooter-hover: #1e8db3;
      --color-tangaroa-light: rgba(3, 36, 61, 0.05);
      --color-border: rgba(3, 36, 61, 0.1);
      
      /* Shadows */
      --shadow-sm: 0 1px 3px rgba(3, 36, 61, 0.06);
      --shadow-md: 0 4px 12px rgba(3, 36, 61, 0.1);
      --shadow-lg: 0 10px 25px rgba(3, 36, 61, 0.1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background-color: var(--color-alice-blue);
      color: var(--color-tangaroa);
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, var(--color-tangaroa) 0%, #04344f 100%);
      color: var(--color-white);
      padding: 2rem 0;
      box-shadow: var(--shadow-md);
    }

    .header-content {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 2rem;
    }

    .header h1 {
      font-size: 2.5rem;
      font-weight: 300;
      letter-spacing: -0.5px;
      margin-bottom: 0.5rem;
    }

    .header h1 strong {
      font-weight: 600;
      color: var(--color-scooter);
    }

    .subtitle {
      font-size: 1rem;
      opacity: 0.8;
      font-weight: 300;
    }

    /* Main Container */
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem;
    }

    /* Input Section */
    .input-section {
      background: var(--color-white);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 2rem;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--color-border);
    }

    .input-wrapper {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .input-field {
      flex: 1;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      border: 2px solid var(--color-border);
      border-radius: 8px;
      background: var(--color-white);
      color: var(--color-tangaroa);
      transition: all 0.3s ease;
    }

    .input-field:focus {
      outline: none;
      border-color: var(--color-scooter);
      box-shadow: 0 0 0 3px var(--color-scooter-light);
    }

    .load-button {
      padding: 0.75rem 2rem;
      background: var(--color-scooter);
      color: var(--color-white);
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .load-button:hover {
      background: var(--color-scooter-hover);
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
    }

    .load-button:active {
      transform: translateY(0);
    }

    /* Main Content Grid */
    .main-content {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 2rem;
      align-items: start;
    }

    /* Video Section */
    .video-section {
      background: var(--color-tangaroa);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: var(--shadow-lg);
    }

    video {
      width: 100%;
      height: auto;
      max-height: 70vh;
      display: block;
      background-color: #000;
    }

    /* Info Panel */
    .info-panel {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      height: 70vh;
    }

    .info-box {
      background: var(--color-white);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--color-border);
      display: flex;
      flex-direction: column;
    }

    .info-box-header {
      background: linear-gradient(135deg, var(--color-scooter) 0%, #1e8db3 100%);
      color: var(--color-white);
      padding: 1rem 1.5rem;
      font-weight: 500;
      font-size: 1.1rem;
      letter-spacing: 0.5px;
    }

    .info-box-content {
      padding: 1rem;
      font-family: 'SF Mono', Monaco, 'Cascadia Code', 'Roboto Mono', Consolas, monospace;
      font-size: 0.875rem;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-all;
      overflow-y: auto;
      background: #fafbfc;
      color: var(--color-tangaroa);
    }

    #mediaInfo {
      flex: 0 0 auto;
      max-height: 250px;
    }

    .log-box {
      flex: 1;
      min-height: 0;
    }

    #log {
      height: 100%;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--color-scooter-light) transparent;
    }

    #log::-webkit-scrollbar {
      width: 8px;
    }

    #log::-webkit-scrollbar-track {
      background: transparent;
    }

    #log::-webkit-scrollbar-thumb {
      background: var(--color-scooter-light);
      border-radius: 4px;
    }

    #log::-webkit-scrollbar-thumb:hover {
      background: var(--color-scooter);
    }

    /* Loading Animation */
    @keyframes pulse {
      0% {
        opacity: 1;
      }
      50% {
        opacity: 0.6;
      }
      100% {
        opacity: 1;
      }
    }

    .loading {
      animation: pulse 1.5s ease-in-out infinite;
    }

    /* Responsive Design */
    @media (max-width: 1024px) {
      .main-content {
        grid-template-columns: 1fr;
      }
      
      .info-panel {
        height: auto;
        grid-template-columns: 1fr 1fr;
      }
      
      .log-box {
        grid-column: span 2;
        height: 300px;
      }
    }

    @media (max-width: 768px) {
      .header h1 {
        font-size: 2rem;
      }
      
      .container {
        padding: 1rem;
      }
      
      .input-wrapper {
        flex-direction: column;
      }
      
      .load-button {
        width: 100%;
      }
      
      .info-panel {
        grid-template-columns: 1fr;
      }
    }

    /* Status Indicator */
    .status-indicator {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.25rem 0.75rem;
      background: var(--color-tangaroa-light);
      border-radius: 20px;
      font-size: 0.875rem;
      margin-left: 1rem;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--color-scooter);
      animation: pulse 2s ease-in-out infinite;
    }

    .status-dot.inactive {
      background: #999;
      animation: none;
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-content">
      <h1><strong>BJSN</strong> Player</h1>
      <p class="subtitle">Advanced Media Streaming Test Interface by Harmonic Inc</p>
    </div>
  </header>

  <div class="container">
    <div class="input-section">
      <div class="input-wrapper">
        <input 
          type="text" 
          id="urlInput" 
          class="input-field" 
          value="media_first.mp4" 
          placeholder="Enter media URL..."
        />
        <button id="loadButton" class="load-button">
          Load Stream
        </button>
      </div>
    </div>

    <div class="main-content">
      <div class="video-section">
        <video controls autoplay></video>
      </div>

      <div class="info-panel">
        <div class="info-box">
          <div class="info-box-header">
            Media Information
            <span class="status-indicator" id="statusIndicator" style="display: none;">
              <span class="status-dot"></span>
              <span id="statusText">Active</span>
            </span>
          </div>
          <pre id="mediaInfo" class="info-box-content"></pre>
        </div>

        <div class="info-box log-box">
          <div class="info-box-header">
            Activity Log
          </div>
          <pre id="log" class="info-box-content"></pre>
        </div>
      </div>
    </div>
  </div>

  <script src="bjsn_utils.js"></script>
  <script type="text/javascript">
    (async function() {
      const video = document.querySelector('video');
      const logElement = document.getElementById('log');
      const mediaInfoElement = document.getElementById('mediaInfo');
      const urlInput = document.getElementById('urlInput');
      const loadButton = document.getElementById('loadButton');
      const statusIndicator = document.getElementById('statusIndicator');
      const statusText = document.getElementById('statusText');
      const statusDot = document.querySelector('.status-dot');
      let activeSession = null;
      const MAX_LOG_LINES = 200; // Cap the log to prevent performance issues

      function updateStatus(active, text = null) {
        if (active) {
          statusIndicator.style.display = 'inline-flex';
          statusDot.classList.remove('inactive');
          statusText.textContent = text || 'Active';
        } else {
          if (statusIndicator.style.display !== 'none') {
            statusDot.classList.add('inactive');
            statusText.textContent = 'Inactive';
            setTimeout(() => {
              statusIndicator.style.display = 'none';
            }, 1000);
          }
        }
      }

      function log(message, ...args) {
        console.log(message, ...args);
        const timestamp = new Date().toLocaleTimeString();
        const text = `[${timestamp}] ${message} ${args.map(arg => JSON.stringify(arg, null, 2)).join(' ')}`;
        
        let lines = logElement.textContent.split('\n').filter(line => line.trim());
        lines.push(text);
        if (lines.length > MAX_LOG_LINES) {
          lines = lines.slice(lines.length - MAX_LOG_LINES);
        }
        logElement.textContent = lines.join('\n');

        logElement.scrollTop = logElement.scrollHeight;
      }

      function formatTimeRanges(ranges) {
        if (!ranges || ranges.length === 0) {
            return '[]';
        }
        const parts = [];
        for (let i = 0; i < ranges.length; i++) {
            parts.push(`[${ranges.start(i).toFixed(2)} - ${ranges.end(i).toFixed(2)}]`);
        }
        return `(${ranges.length}) ${parts.join(', ')}`;
      }

      if (!window.MediaSource) {
        log('No Media Source API available');
        return;
      }

      class Mp4BoxUtils {
        static readUint32(data, offset) {
          return (data[offset] << 24) | (data[offset + 1] << 16) | (data[offset + 2] << 8) | data[offset + 3];
        }

        static writeUint32(data, offset, value) {
          data[offset] = (value >> 24) & 0xFF;
          data[offset + 1] = (value >> 16) & 0xFF;
          data[offset + 2] = (value >> 8) & 0xFF;
          data[offset + 3] = value & 0xFF;
        }

        static getBoxType(data, offset) {
          return String.fromCharCode(data[offset], data[offset + 1], data[offset + 2], data[offset + 3]);
        }

        static parseTopLevelBoxes(data) {
          const boxes = [];
          let offset = 0;
          while (offset < data.length - 8) {
            let size = Mp4BoxUtils.readUint32(data, offset);
            const type = Mp4BoxUtils.getBoxType(data, offset + 4);
            if (size === 1) {
              log('64-bit box size not supported');
              return [];
            }
            if (offset + size > data.length) {
              log(`Box ${type} size ${size} exceeds buffer length`);
              break;
            }
            boxes.push({ type, offset, size, data: data.slice(offset, offset + size) });
            offset += size;
          }
          return boxes;
        }

        static parseChildBoxes(parentData) {
            const boxes = [];
            let offset = 8; // Skip parent box header
            while (offset < parentData.length - 8) {
                const size = Mp4BoxUtils.readUint32(parentData, offset);
                const type = Mp4BoxUtils.getBoxType(parentData, offset + 4);
                if (size === 0 || offset + size > parentData.length) {
                    break;
                }
                boxes.push({ type, offset, size, data: parentData.slice(offset, offset + size) });
                offset += size;
            }
            return boxes;
        }
      }

      class BjsnMp4Processor {
        static processFile(data) {
          const strippedData = BjsnMp4Processor.stripBjsnBox(data);
          const boxes = Mp4BoxUtils.parseTopLevelBoxes(strippedData);
          const ftypBox = boxes.find(b => b.type === 'ftyp');
          const moovBox = boxes.find(b => b.type === 'moov');
          const moofBoxes = boxes.filter(b => b.type === 'moof');
          const mdatBoxes = boxes.filter(b => b.type === 'mdat');

          if (!ftypBox || !moovBox) {
            // For subsequent segments, moov is not expected.
            // We can handle this by calling a different method for media segments.
            return BjsnMp4Processor.processMediaSegment(data, []);
          }

          const tracks = BjsnMp4Processor.parseTracksFromMoov(moovBox.data);
          const initSegments = {};
          tracks.forEach(track => {
            initSegments[track.id] = BjsnMp4Processor.createInitSegmentForTrack(ftypBox.data, moovBox.data, track.id, tracks);
          });

          const mediaSegments = BjsnMp4Processor.groupMediaSegmentsByTrack(moofBoxes, mdatBoxes, tracks);
          return { tracks, initSegments, mediaSegments };
        }

        static processMediaSegment(data, trackIds) {
          const boxes = Mp4BoxUtils.parseTopLevelBoxes(data);
          const moofBoxes = boxes.filter(b => b.type === 'moof');
          const mdatBoxes = boxes.filter(b => b.type === 'mdat');

          const tracks = trackIds.map(id => ({ id }));
          const mediaSegments = BjsnMp4Processor.groupMediaSegmentsByTrack(moofBoxes, mdatBoxes, tracks);
          return { mediaSegments };
        }

        static stripBjsnBox(data) {
          const boxes = Mp4BoxUtils.parseTopLevelBoxes(data);
          const nonBjsnBoxes = boxes.filter(b => b.type !== 'bjsn');
          const totalSize = nonBjsnBoxes.reduce((sum, box) => sum + box.data.length, 0);
          const result = new Uint8Array(totalSize);
          let offset = 0;
          nonBjsnBoxes.forEach(box => {
            result.set(box.data, offset);
            offset += box.data.length;
          });
          return result;
        }

        static parseTracksFromMoov(moovData) {
          const tracks = [];
          const moovChildren = Mp4BoxUtils.parseChildBoxes(moovData);
          moovChildren.forEach(child => {
            if (child.type === 'trak') {
              const track = BjsnMp4Processor.parseTrack(child.data);
              if (track) {
                tracks.push(track);
              }
            }
          });
          return tracks;
        }

        static parseTrack(trakData) {
          let trackId = null;
          let handlerType = null;
          const trakChildren = Mp4BoxUtils.parseChildBoxes(trakData);
          const tkhdBox = trakChildren.find(b => b.type === 'tkhd');
          if (tkhdBox) {
            trackId = BjsnMp4Processor.parseTrackId(tkhdBox.data);
          }
          const mdiaBox = trakChildren.find(b => b.type === 'mdia');
          if (mdiaBox) {
            handlerType = BjsnMp4Processor.findHandlerType(mdiaBox.data);
          }
          if (trackId !== null && handlerType !== null) {
            return { id: trackId, handlerType, trak: trakData };
          }
          return null;
        }

        static parseTrackId(tkhdData) {
          const version = tkhdData[8];
          // version(1) + flags(3) + creation_time(4/8) + modification_time(4/8)
          const trackIdOffset = version === 1 ? 28 : 20;
          if (tkhdData.length >= trackIdOffset + 4) {
            return Mp4BoxUtils.readUint32(tkhdData, trackIdOffset);
          }
          return null;
        }

        static findHandlerType(mdiaData) {
          const mdiaChildren = Mp4BoxUtils.parseChildBoxes(mdiaData);
          const hdlrBox = mdiaChildren.find(b => b.type === 'hdlr');
          if (hdlrBox && hdlrBox.data.length >= 24) {
            return Mp4BoxUtils.getBoxType(hdlrBox.data, 16);
          }
          return null;
        }

        static createInitSegmentForTrack(ftypData, moovData, trackId, allTracks) {
          const filteredMoov = BjsnMp4Processor.filterMoovForTrack(moovData, trackId, allTracks);
          const initSegment = new Uint8Array(ftypData.length + filteredMoov.length);
          initSegment.set(ftypData, 0);
          initSegment.set(filteredMoov, ftypData.length);
          return initSegment;
        }

        static filterMoovForTrack(moovData, trackId, allTracks) {
            const moovChildren = Mp4BoxUtils.parseChildBoxes(moovData);
            const filteredChildren = [];
            moovChildren.forEach(child => {
                if (child.type !== 'trak' && child.type !== 'mvex') {
                    filteredChildren.push(child.data);
                } else if (child.type === 'trak') {
                    const currentTrackId = BjsnMp4Processor.getTrackIdFromTrak(child.data);
                    if (currentTrackId === trackId) {
                        filteredChildren.push(child.data);
                    }
                } else if (child.type === 'mvex') {
                    // Keep mvex, but filter trex inside
                    const mvexChildren = Mp4BoxUtils.parseChildBoxes(child.data);
                    const filteredTrex = mvexChildren.filter(trex => {
                        if (trex.type === 'trex') {
                            const trexTrackId = Mp4BoxUtils.readUint32(trex.data, 12);
                            return trexTrackId === trackId;
                        }
                        return true; // keep other boxes inside mvex
                    });
                    const newMvexPayload = new Uint8Array(filteredTrex.reduce((s, b) => s + b.data.length, 0));
                    let offset = 0;
                    filteredTrex.forEach(b => {
                        newMvexPayload.set(b.data, offset);
                        offset += b.data.length;
                    });

                    const newMvex = new Uint8Array(8 + newMvexPayload.length);
                    Mp4BoxUtils.writeUint32(newMvex, 0, newMvex.length);
                    newMvex[4] = 'm'.charCodeAt(0);
                    newMvex[5] = 'v'.charCodeAt(0);
                    newMvex[6] = 'e'.charCodeAt(0);
                    newMvex[7] = 'x'.charCodeAt(0);
                    newMvex.set(newMvexPayload, 8);
                    filteredChildren.push(newMvex);
                }
            });

            const payloadSize = filteredChildren.reduce((sum, child) => sum + child.length, 0);
            const payload = new Uint8Array(payloadSize);
            let offset = 0;
            filteredChildren.forEach(child => {
                payload.set(child, offset);
                offset += child.length;
            });

            const newMoov = new Uint8Array(8 + payload.length);
            Mp4BoxUtils.writeUint32(newMoov, 0, newMoov.length);
            newMoov[4] = 'm'.charCodeAt(0);
            newMoov[5] = 'o'.charCodeAt(0);
            newMoov[6] = 'o'.charCodeAt(0);
            newMoov[7] = 'v'.charCodeAt(0);
            newMoov.set(payload, 8);
            return newMoov;
        }

        static getTrackIdFromTrak(trakData) {
            const tkhdBox = Mp4BoxUtils.parseChildBoxes(trakData).find(b => b.type === 'tkhd');
            if (tkhdBox) {
                return BjsnMp4Processor.parseTrackId(tkhdBox.data);
            }
            return null;
        }

        static groupMediaSegmentsByTrack(moofBoxes, mdatBoxes, tracks) {
          const mediaSegments = {};
          tracks.forEach(t => mediaSegments[t.id] = []);

          if (moofBoxes.length !== mdatBoxes.length) {
              log('Warning: moof and mdat box counts do not match.');
          }

          for (let i = 0; i < moofBoxes.length; i++) {
              const moof = moofBoxes[i];
              const mdat = mdatBoxes[i];
              const trackId = BjsnMp4Processor.getTrackIdFromMoof(moof.data);
              if (trackId && mediaSegments[trackId]) {
                  const segmentData = new Uint8Array(moof.size + mdat.size);
                  segmentData.set(moof.data, 0);
                  segmentData.set(mdat.data, moof.size);
                  mediaSegments[trackId].push(segmentData);
              }
          }
          return mediaSegments;
        }

        static getTrackIdFromMoof(moofData) {
            const trafBox = Mp4BoxUtils.parseChildBoxes(moofData).find(b => b.type === 'traf');
            if (trafBox) {
                const tfhdBox = Mp4BoxUtils.parseChildBoxes(trafBox.data).find(b => b.type === 'tfhd');
                if (tfhdBox) {
                    // A 'tfhd' box is a "full box" which contains a version and flags.
                    // The track_ID is after the 8-byte box header, 1-byte version, and 3-byte flags.
                    const trackIdOffset = 8 + 4;
                    if (tfhdBox.data.length >= trackIdOffset + 4) {
                      return Mp4BoxUtils.readUint32(tfhdBox.data, trackIdOffset);
                    }
                }
            }
            return null;
        }
      }

      class SegmentDownloadManager {
        constructor(normalInterval) {
          this.state = 'NORMAL';  // NORMAL, RETRY, RECOVERING
          this.normalInterval = normalInterval; // Passed from segmentDurationMs
          this.retryInterval = 100;   // 100ms for failed downloads
          this.maxRetryAttempts = 10; // Maximum consecutive retries before backing off
          this.consecutiveFailures = 0;
          this.lastSuccessTime = Date.now();
        }

        // Calculate next download delay based on current state and fetch result
        calculateNextDelay(fetchSuccess, fetchStartTime, fetchEndTime) {
          const fetchDuration = fetchEndTime - fetchStartTime;
          
          if (fetchSuccess) {
            return this.handleSuccessfulFetch(fetchDuration);
          } else {
            return this.handleFailedFetch();
          }
        }

        handleSuccessfulFetch(fetchDuration) {
          if (this.state === 'RETRY') {
            // Transitioning from retry to normal - start recovery
            this.state = 'RECOVERING';
            this.consecutiveFailures = 0;
            this.lastSuccessTime = Date.now();
            
            // Start with normal interval minus fetch time
            const delay = Math.max(0, this.normalInterval - fetchDuration);
            log(`Download successful after retries. Entering RECOVERING state. Next fetch in ${delay}ms`);
            return delay;
            
          } else if (this.state === 'RECOVERING') {
            // Already in recovery, continue with normal timing
            this.state = 'NORMAL';
            this.lastSuccessTime = Date.now();
            
            const delay = Math.max(0, this.normalInterval - fetchDuration);
            log(`Recovery complete. Returning to NORMAL state. Next fetch in ${delay}ms`);
            return delay;
            
          } else {
            // Normal successful fetch
            this.consecutiveFailures = 0;
            this.lastSuccessTime = Date.now();
            
            const delay = Math.max(0, this.normalInterval - fetchDuration);
            log(`Normal successful fetch. Next fetch in ${delay}ms`);
            return delay;
          }
        }

        handleFailedFetch() {
          this.consecutiveFailures++;
          
          if (this.state === 'NORMAL' || this.state === 'RECOVERING') {
            // Enter retry state
            this.state = 'RETRY';
            log(`Download failed. Entering RETRY state. Consecutive failures: ${this.consecutiveFailures}`);
          }
          
          // Progressive backoff for excessive failures
          let delay = this.retryInterval;
          if (this.consecutiveFailures > this.maxRetryAttempts) {
            delay = Math.min(this.retryInterval * Math.pow(2, this.consecutiveFailures - this.maxRetryAttempts), 5000);
            log(`Excessive failures (${this.consecutiveFailures}). Using progressive backoff: ${delay}ms`);
          } else {
            log(`Retry attempt ${this.consecutiveFailures}. Next retry in ${delay}ms`);
          }
          
          return delay;
        }

        getState() {
          return {
            state: this.state,
            consecutiveFailures: this.consecutiveFailures,
            timeSinceLastSuccess: Date.now() - this.lastSuccessTime
          };
        }
      }

      // Progressive MP4 parser for early extraction of BJSN and init segments
      class ProgressiveMp4Parser {
        constructor() {
          this.buffer = new Uint8Array(0);
          this.parsedBoxes = [];
          this.bjsnData = null;
          this.ftypBox = null;
          this.moovBox = null;
          this.foundAllInit = false;
        }

        appendData(newData) {
          // Append new data to buffer
          const combined = new Uint8Array(this.buffer.length + newData.length);
          combined.set(this.buffer);
          combined.set(newData, this.buffer.length);
          this.buffer = combined;

          // Try to parse more boxes
          this.parseAvailableBoxes();
        }

        parseAvailableBoxes() {
          let offset = 0;
          
          while (offset < this.buffer.length - 8) {
            // Need at least 8 bytes for size and type
            const size = Mp4BoxUtils.readUint32(this.buffer, offset);
            const type = Mp4BoxUtils.getBoxType(this.buffer, offset + 4);
            
            if (size === 0 || size === 1) {
              // Special cases we don't handle
              break;
            }
            
            if (offset + size > this.buffer.length) {
              // Box not fully available yet
              break;
            }
            
            // Extract complete box
            const boxData = this.buffer.slice(offset, offset + size);
            const box = { type, offset, size, data: boxData };
            this.parsedBoxes.push(box);
            
            // Process specific box types
            if (type === 'bjsn' && !this.bjsnData) {
              this.bjsnData = this.parseBjsnBox(boxData);
              log('BJSN box found and parsed early:', this.bjsnData);
            } else if (type === 'ftyp' && !this.ftypBox) {
              this.ftypBox = box;
              log('ftyp box found, size:', size);
            } else if (type === 'moov' && !this.moovBox) {
              this.moovBox = box;
              log('moov box found, size:', size);
              this.foundAllInit = true;
            }
            
            offset += size;
          }
          
          // Remove parsed data from buffer
          if (offset > 0) {
            this.buffer = this.buffer.slice(offset);
          }
        }

        parseBjsnBox(boxData) {
          try {
            // Skip 8-byte box header
            const jsonData = boxData.slice(8);
            const jsonString = new TextDecoder().decode(jsonData);
            return JSON.parse(jsonString);
          } catch (e) {
            log('Failed to parse BJSN box:', e.message);
            return null;
          }
        }

        hasInitSegments() {
          return this.ftypBox && this.moovBox;
        }

        getInitSegments() {
          if (!this.hasInitSegments()) {
            return null;
          }
          
          // Process and return init segments
          const tracks = BjsnMp4Processor.parseTracksFromMoov(this.moovBox.data);
          const initSegments = {};
          
          tracks.forEach(track => {
            initSegments[track.id] = BjsnMp4Processor.createInitSegmentForTrack(
              this.ftypBox.data, 
              this.moovBox.data, 
              track.id, 
              tracks
            );
          });
          
          return { tracks, initSegments };
        }

        getRemainingBoxes() {
          // Return all parsed boxes except bjsn, ftyp, and moov
          return this.parsedBoxes.filter(box => 
            box.type !== 'bjsn' && box.type !== 'ftyp' && box.type !== 'moov'
          );
        }
      }

      // State machine for managing playback session
      class PlaybackStateMachine {
        constructor(videoElement, sourceBuffers) {
          this.video = videoElement;
          this.sourceBuffers = sourceBuffers;
          this.state = 'IDLE';
          this.pendingOperations = [];
          this.currentOperation = null;
          
          // Set up updateend handlers
          Object.values(sourceBuffers).forEach(sb => {
            sb.addEventListener('updateend', () => this.onUpdateEnd(sb));
            sb.addEventListener('error', (e) => this.onError(sb, e));
          });
        }

        enqueue(operation) {
          this.pendingOperations.push(operation);
          this.processNext();
        }

        processNext() {
          if (this.currentOperation || this.pendingOperations.length === 0) {
            return;
          }
          
          this.currentOperation = this.pendingOperations.shift();
          const { type, sourceBuffer, data, callback } = this.currentOperation;
          
          try {
            if (type === 'append') {
              sourceBuffer.appendBuffer(data);
              this.state = 'APPENDING';
            } else if (type === 'remove') {
              sourceBuffer.remove(data.start, data.end);
              this.state = 'REMOVING';
            }
          } catch (e) {
            log(`Error in ${type} operation:`, e.message);
            if (callback) callback(e);
            this.currentOperation = null;
            this.state = 'ERROR';
            this.processNext();
          }
        }

        onUpdateEnd(sourceBuffer) {
          if (!this.currentOperation) return;
          
          const { callback } = this.currentOperation;
          if (callback) callback(null);
          
          this.currentOperation = null;
          this.state = 'IDLE';
          this.processNext();
        }

        onError(sourceBuffer, error) {
          log('SourceBuffer error:', error);
          if (this.currentOperation && this.currentOperation.callback) {
            this.currentOperation.callback(error);
          }
          this.currentOperation = null;
          this.state = 'ERROR';
          this.processNext();
        }
      }

      class PlaybackSession {
        constructor(videoElement, initialUrl) {
          this.video = videoElement;
          this.initialUrl = initialUrl;
          this.ms = new MediaSource();
          this.fetchInterval = null;
          this.logInterval = null;
          this.isActive = true;
          this.progressiveParser = new ProgressiveMp4Parser();
          this.stateMachine = null;
          this.videoTrack = null;
          this.audioTrack = null;
          this.currentSeqNum = null;
          this.templateUrl = null;
          this.baseUrl = null;
          this.downloadManager = null;
          this.initialDataProcessed = false;
        }

        async start() {
          this.video.src = window.URL.createObjectURL(this.ms);
          this.ms.addEventListener('sourceopen', () => this.onSourceOpen());
          updateStatus(true, 'Initializing');
        }

        stop() {
          this.isActive = false;
          updateStatus(false);
          if (this.fetchInterval) {
            clearTimeout(this.fetchInterval);
            this.fetchInterval = null;
          }
          if (this.logInterval) {
            clearInterval(this.logInterval);
            this.logInterval = null;
          }
          try {
            if (this.ms && this.ms.readyState === 'open') {
              this.ms.endOfStream();
            }
          } catch (e) {
            log('Error during endOfStream:', e.message);
          }
          if (this.video.src) {
            window.URL.revokeObjectURL(this.video.src);
            this.video.removeAttribute('src');
            this.video.load();
          }
        }

        async onSourceOpen() {
          if (!this.isActive) return;

          try {
            log('MediaSource opened');
            updateStatus(true, 'Loading');
            
            // Start progressive download with fetch API
            log('Starting progressive fetch:', this.initialUrl);
            const response = await fetch(this.initialUrl);
            
            if (!response.ok) {
              throw new Error(`HTTP error! status: ${response.status}`);
            }
            
            const reader = response.body.getReader();
            let receivedLength = 0;
            
            while (true) {
              const { done, value } = await reader.read();
              
              if (done) break;
              if (!this.isActive) {
                reader.cancel();
                return;
              }
              
              receivedLength += value.length;
              log(`Received chunk: ${value.length} bytes, total: ${receivedLength}`);
              
              // Feed data to progressive parser
              this.progressiveParser.appendData(value);
              
              // Process parsed data as soon as available
              await this.processAvailableData();
            }
            
            // Process any remaining data
            await this.processFinalData();
            
            // Start fetching subsequent segments
            if (this.isActive) {
              this.scheduleNextSegmentFetch();
            }
            
          } catch (error) {
            if (this.isActive) {
              log('Error in playback session:', error);
              updateStatus(false);
            }
          }
        }

        async processAvailableData() {
          // Check if we have BJSN data
          if (this.progressiveParser.bjsnData && !this.currentSeqNum) {
            const bjsnData = this.progressiveParser.bjsnData;
            log('Processing BJSN data early');
            
            this.currentSeqNum = bjsnData.seq_num;
            this.templateUrl = bjsnData.template_path;
            this.baseUrl = new URL(this.initialUrl, window.location.href);
            
            // Update media info display
            mediaInfoElement.textContent = `BJSN Info:\n${JSON.stringify(bjsnData, null, 2)}`;
          }
          
          // Check if we have init segments
          if (this.progressiveParser.hasInitSegments() && !this.stateMachine) {
            log('Processing init segments early');
            
            const initData = this.progressiveParser.getInitSegments();
            const { tracks, initSegments } = initData;
            
            this.videoTrack = tracks.find(t => t.handlerType === 'vide');
            this.audioTrack = tracks.find(t => t.handlerType === 'soun');
            
            if (!this.videoTrack || !this.audioTrack) {
              throw new Error('Could not find both video and audio tracks.');
            }
            
            // Detect codecs
            const videoInit = initSegments[this.videoTrack.id];
            const audioInit = initSegments[this.audioTrack.id];
            
            const videoCodecInfo = await BjsnUtils.BjsnCodecDetector.detectCodecsFromSegment(videoInit);
            const audioCodecInfo = await BjsnUtils.BjsnCodecDetector.detectCodecsFromSegment(audioInit);
            const videoCodec = videoCodecInfo.video;
            const audioCodec = audioCodecInfo.audio;
            
            if (!videoCodec || !audioCodec) {
              throw new Error('Could not detect codecs.');
            }
            
            log('Codecs detected:', { video: videoCodec, audio: audioCodec });
            
            // Update media info
            mediaInfoElement.textContent += `\n\nCodec Information:\n  Video: ${videoCodec}\n  Audio: ${audioCodec}`;
            
            // Create source buffers
            if (!this.isActive || this.ms.readyState !== 'open') return;
            
            const videoSourceBuffer = this.ms.addSourceBuffer(`video/mp4; codecs="${videoCodec}"`);
            const audioSourceBuffer = this.ms.addSourceBuffer(`audio/mp4; codecs="${audioCodec}"`);
            videoSourceBuffer.mode = 'sequence';
            audioSourceBuffer.mode = 'sequence';
            
            // Initialize state machine
            this.stateMachine = new PlaybackStateMachine(this.video, {
              video: videoSourceBuffer,
              audio: audioSourceBuffer
            });
            
            // Start buffer logging
            this.logInterval = setInterval(() => {
              if (!this.isActive) return;
              try {
                log('Video Buffer:', formatTimeRanges(videoSourceBuffer.buffered));
                log('Audio Buffer:', formatTimeRanges(audioSourceBuffer.buffered));
              } catch (e) {
                log('Error logging buffer state:', e.message);
              }
            }, 2000);
            
            // Append init segments immediately
            log('Appending init segments immediately');
            this.stateMachine.enqueue({
              type: 'append',
              sourceBuffer: videoSourceBuffer,
              data: videoInit,
              callback: () => log('Video init segment appended')
            });
            
            this.stateMachine.enqueue({
              type: 'append',
              sourceBuffer: audioSourceBuffer,
              data: audioInit,
              callback: () => log('Audio init segment appended')
            });
          }
        }

        async processFinalData() {
          if (!this.stateMachine || this.initialDataProcessed) return;
          
          this.initialDataProcessed = true;
          log('Processing remaining media segments from initial file');
          
          // Get remaining boxes (moof/mdat pairs)
          const remainingBoxes = this.progressiveParser.getRemainingBoxes();
          const moofBoxes = remainingBoxes.filter(b => b.type === 'moof');
          const mdatBoxes = remainingBoxes.filter(b => b.type === 'mdat');
          
          // Group by track
          const tracks = [this.videoTrack, this.audioTrack];
          const mediaSegments = BjsnMp4Processor.groupMediaSegmentsByTrack(moofBoxes, mdatBoxes, tracks);
          
          // Append media segments
          const videoSB = this.stateMachine.sourceBuffers.video;
          const audioSB = this.stateMachine.sourceBuffers.audio;
          
          let firstSegmentAppended = false;
          
          // Append video segments
          if (mediaSegments[this.videoTrack.id]) {
            mediaSegments[this.videoTrack.id].forEach((seg, index) => {
              this.stateMachine.enqueue({
                type: 'append',
                sourceBuffer: videoSB,
                data: seg,
                callback: () => {
                  log(`Video segment ${index} appended`);
                  if (!firstSegmentAppended) {
                    firstSegmentAppended = true;
                    this.onFirstSegmentAppended();
                  }
                }
              });
            });
          }
          
          // Append audio segments
          if (mediaSegments[this.audioTrack.id]) {
            mediaSegments[this.audioTrack.id].forEach((seg, index) => {
              this.stateMachine.enqueue({
                type: 'append',
                sourceBuffer: audioSB,
                data: seg,
                callback: () => log(`Audio segment ${index} appended`)
              });
            });
          }
        }

        onFirstSegmentAppended() {
          // Set currentTime to start playback
          if (this.video.buffered.length > 0) {
            try {
              log('Setting currentTime to start of buffered range:', this.video.buffered.start(0));
              this.video.currentTime = this.video.buffered.start(0);
              updateStatus(true, 'Playing');
            } catch (e) {
              log('Error setting currentTime:', e.message);
            }
          }
        }

        scheduleNextSegmentFetch() {
          const segmentDurationMs = 2000; // Assume 2-second segments
          this.downloadManager = new SegmentDownloadManager(segmentDurationMs);
          
          const scheduleNextFetch = (delay) => {
            if (!this.isActive) return;
            this.fetchInterval = setTimeout(() => this.fetchNextSegment(), delay);
          };
          
          scheduleNextFetch(segmentDurationMs);
        }

        async fetchNextSegment() {
          if (!this.isActive || !this.stateMachine) return;
          
          const startTime = Date.now();
          let fetchSuccess = false;
          this.currentSeqNum++;
          
          const nextSegmentFile = this.templateUrl.replace('${num}', this.currentSeqNum);
          const nextUrl = new URL(nextSegmentFile, this.baseUrl).href;
          
          try {
            log('Fetching next segment:', nextUrl);
            const response = await fetch(nextUrl);
            
            if (!response.ok) {
              throw new Error(`HTTP error! status: ${response.status}`);
            }
            
            const data = await response.arrayBuffer();
            const nextData = new Uint8Array(data);
            
            if (!this.isActive) return;
            
            log('Fetched segment', this.currentSeqNum, 'size:', nextData.length);
            
            // Process the segment
            const nextProcessed = BjsnMp4Processor.processMediaSegment(nextData, [this.videoTrack.id, this.audioTrack.id]);
            
            // Append segments
            const videoSB = this.stateMachine.sourceBuffers.video;
            const audioSB = this.stateMachine.sourceBuffers.audio;
            
            if (nextProcessed.mediaSegments[this.videoTrack.id]) {
              nextProcessed.mediaSegments[this.videoTrack.id].forEach(seg => {
                this.stateMachine.enqueue({
                  type: 'append',
                  sourceBuffer: videoSB,
                  data: seg
                });
              });
            }
            
            if (nextProcessed.mediaSegments[this.audioTrack.id]) {
              nextProcessed.mediaSegments[this.audioTrack.id].forEach(seg => {
                this.stateMachine.enqueue({
                  type: 'append',
                  sourceBuffer: audioSB,
                  data: seg
                });
              });
            }
            
            fetchSuccess = true;
          } catch (e) {
            log('Failed to fetch segment', this.currentSeqNum, e.message);
            this.currentSeqNum--;
          } finally {
            if (this.isActive) {
              const endTime = Date.now();
              const delay = this.downloadManager.calculateNextDelay(fetchSuccess, startTime, endTime);
              this.fetchInterval = setTimeout(() => this.fetchNextSegment(), delay);
            }
          }
        }
      }

      loadButton.addEventListener('click', () => {
        const url = urlInput.value.trim();
        if (!url) {
          log('URL input is empty');
          return;
        }

        if (activeSession) {
          log('Stopping active session');
          activeSession.stop();
        }

        log('Starting new session for URL:', url);
        activeSession = new PlaybackSession(video, url);
        activeSession.start();
      });

      // Add keyboard shortcut for Enter key
      urlInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          loadButton.click();
        }
      });
    })();
  </script>
</body>
