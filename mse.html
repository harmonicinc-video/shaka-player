<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MSE Demo</title>
</head>
<body>
  <h1>MSE Demo</h1>
  <div>
    <video controls width="80%"></video>
  </div>

  <script type="text/javascript">
    (function() {
      var video = document.querySelector('video');

      if (!window.MediaSource) {
        console.error('No Media Source API available');
        return;
      }

      var ms = new MediaSource();
      video.src = window.URL.createObjectURL(ms);
      ms.addEventListener('sourceopen', onMediaSourceOpen);

      function onMediaSourceOpen() {
        var vInitFile = 'media_first_video_init.mp4';
        var vMediaFile = 'media_first_video_media.mp4';
        var vCodec = 'avc1.64001E';
        // var vInitFile = 'init.mp4';
        // var vMediaFile = 'bigVideo.mp4';
        // var vCodec = 'avc1.64001e'

        var videoSourceBuffer =
            ms.addSourceBuffer('video/mp4; codecs="' + vCodec +'"');
            
        var audioSourceBuffer =
            ms.addSourceBuffer('audio/mp4; codecs="mp4a.40.2"');
       
        var onVideoInitAppended = function() {
          videoSourceBuffer.removeEventListener('updateend', onVideoInitAppended);
          GET(vMediaFile, function(data) {
            videoSourceBuffer.addEventListener('updateend', onMediaAppended);
            videoSourceBuffer.appendBuffer(new Uint8Array(data));
          });
        };
        videoSourceBuffer.addEventListener('updateend', onVideoInitAppended);

        var onMediaAppended = function() {
          videoSourceBuffer.removeEventListener('updateend', onMediaAppended);
          if (video.buffered.length > 0) {
            video.currentTime = video.buffered.start(0);
          }
        };

        var onAudioInitAppended = function() {
          audioSourceBuffer.removeEventListener('updateend', onAudioInitAppended);
          GET('media_first_audio_media.mp4', function(data) {
            audioSourceBuffer.appendBuffer(new Uint8Array(data));
          });
        };
        audioSourceBuffer.addEventListener('updateend', onAudioInitAppended);

        GET(vInitFile, function(data) {
          videoSourceBuffer.appendBuffer(new Uint8Array(data));
        });
        GET('media_first_audio_init.mp4', function(data) {
          audioSourceBuffer.appendBuffer(new Uint8Array(data));
        });

        video.play();
      }

      function GET(url, callback) {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', url);
        xhr.responseType = 'arraybuffer';

        xhr.onload = function(e) {
          if (xhr.status != 200) {
            console.warn('Unexpected status code ' + xhr.status + ' for ' + url);
            return false;
          }
          callback(xhr.response);
        };

        xhr.send();
      }
    })();
  </script>
</body>
</html>
